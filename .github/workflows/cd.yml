name: CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build do pacote (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ferramentas de build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Construir pacote (sdist + wheel)
        run: python -m build

      - name: Enviar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ github.event.pull_request.number || github.run_number }}
          path: dist/

  deploy:
    name: Deploy (GitHub Release)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ferramentas de build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Construir pacote (sdist + wheel)
        run: python -m build

      - name: Criar tag e publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Release v0.1.${{ github.run_number }}
          body: |
            Release gerada automaticamente pelo workflow de CD.

            **Conteúdo:**
            - Pacote fonte (sdist)
            - Wheel instalável via pip
          files: dist/*
